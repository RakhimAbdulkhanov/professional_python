[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-manager"
version = "0.1.0"
description = "Student management system for Professional Python, variant 1"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Абдулханов Абдул-Рахім"}]
dependencies = []

[project.scripts]
student-manager = "student_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
