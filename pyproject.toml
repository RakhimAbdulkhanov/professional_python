[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-manager"
version = "0.1.0"
description = "Student management system for Professional Python, variant 1"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Абдулханов Абдул-Рахім"}]
dependencies = ["PyYAML>=6.0", "SQLAlchemy>=2.0", "alembic>=1.13"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "types-PyYAML>=6.0", "ruff>=0.9", "pytest>=8", "pytest-cov>=5"]

[project.scripts]
student-manager = "student_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"student_manager.persistence.migrations" = ["script.py.mako"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: isolated component behavior",
    "integration: real collaboration between components",
]

[tool.coverage.run]
branch = true
source = ["student_manager"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
